spring.application.name=salud-agil
server.port=8080

# --- Base de datos en memoria (desarrollo). Para MariaDB usar el perfil "mariadb".
spring.datasource.url=jdbc:h2:mem:saludagil;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.jackson.time-zone=America/Bogota

# --- Reglas de negocio
saludagil.turnos.apertura=07:00
saludagil.turnos.cierre=17:00
saludagil.turnos.minutos-franja=30
saludagil.turnos.cupo-por-franja=4
saludagil.turnos.dias-maximos-anticipacion=7
saludagil.inventario.umbral-pocas-unidades=10

# --- Metas de los acuerdos de nivel de servicio (SLA)
saludagil.metas.tiempo-dispensacion-horas=24
saludagil.metas.entregas-completas=90
saludagil.metas.exactitud-inventario=95
saludagil.metas.satisfaccion=4.0

# --- Orígenes permitidos para el frontend (separados por coma)
saludagil.cors-origenes=http://localhost:5173,http://localhost:3000
