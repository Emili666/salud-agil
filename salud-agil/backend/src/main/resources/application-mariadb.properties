spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:saludagil}?allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:saludagil}
spring.datasource.password=${DB_PASSWORD:saludagil}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}
spring.h2.console.enabled=false
