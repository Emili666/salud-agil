server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # En Docker Compose proxya /api/ a backend:8080. Usar una variable evita que Nginx
    # falle al arrancar en Railway (donde el frontend usa VITE_API_URL y no existe "backend").
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
