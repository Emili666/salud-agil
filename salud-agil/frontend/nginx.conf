server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # La API se sirve desde el mismo origen: no hace falta CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
